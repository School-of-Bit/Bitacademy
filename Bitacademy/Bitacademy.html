<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitacademy</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Regras de Controle de Acesso (RBAC) */
        .teacher-only {
            display: none;
        }

        /* Estilização do botão de adicionar e do formulário */
        .btn-add-subject {
            background-color: #3b82f6; /* Azul Bitacademy */
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            font-weight: bold;
        }

        .admin-panel {
            background-color: #f8fafc;
            border: 2px dashed #cbd5e1;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .admin-form input, .admin-form text-area {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body class="home-page">
    <!-- Header e Hero Section permanecem iguais... -->
    
    <main class="home-main">
        <!-- Secões Introdução, Overview e Trilhas permanecem iguais... -->

        <section id="disciplinas" class="subjects-section">
            <div class="section-heading">
                <p class="eyebrow">Biblioteca</p>
                <h2>Disciplinas disponíveis</h2>
                <p>Cada área tem uma página própria com explicações e um caminho direto para praticar.</p>
                <span id="user-info" style="font-weight: bold; color: #3b82f6;"></span>
            </div>

            <!-- O Grid agora está vazio no HTML. O JS vai preenchê-lo! -->
            <div class="subject-grid" id="dynamic-subject-grid">
                <!-- Os cards das matérias entrarão aqui dinamicamente -->
            </div>

            <!-- PAINEL EXCLUSIVO DO PROFESSOR -->
            <div class="teacher-only admin-panel" id="teacher-panel">
                <h3>🛠️ Painel do Professor: Nova Disciplina</h3>
                <div class="admin-form">
                    <input type="text" id="new-icon" placeholder="Ícone (ex: 💻)" required>
                    <input type="text" id="new-title" placeholder="Nome da Disciplina (ex: Lógica de Programação)" required>
                    <input type="text" id="new-desc" placeholder="Breve descrição do que será ensinado" required>
                    <input type="text" id="new-link" placeholder="Nome do arquivo HTML (ex: logica.html)" required>
                    <button class="btn-add-subject" onclick="adicionarDisciplina()">Salvar no Banco de Dados</button>
                </div>
            </div>
        </section>

        <!-- Seção Quizzes permanece igual... -->
    </main>

    <footer>
        <p>&copy; 2026 BitAcademy. Todos os direitos reservados.</p>
    </footer>

    <!-- Importando a lógica dinâmica -->
    <script src="home-manager.js"></script>
</body>
</html>
